# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: agentpay
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PAYPAL_ENV
        value: sandbox
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash
      # Secrets: Render asks you for these when you create the Blueprint.
      - key: ADMIN_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Supabase Postgres connection string (Session pooler). Without it, data is a file that Render wipes.
      - key: DATABASE_URL
        sync: false
